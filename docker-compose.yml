# Local infrastructure. The api service is added in BE-09.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NOMBRE:-crowdradar}
      POSTGRES_USER: ${DB_USUARIO:-crowdradar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambiar-password-local}
    ports:
      - "${DB_PUERTO:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  base-de-datos:
    name: Database-backed tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway service of this job only; it is not a deployment secret.
          POSTGRES_USER: crowdradar
          POSTGRES_PASSWORD: crowdradar-ci
          POSTGRES_DB: crowdradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crowdradar -d crowdradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://crowdradar:crowdradar-ci@localhost:5432/crowdradar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # test:db reruns the full suite on purpose: the database-backed cases live inside files that also hold
      # database-free cases (describe.skipIf), so selecting files would need a second list to keep in sync and
      # could silently drop a new contract. The extra ~5 s buys the guarantee that nothing is skipped.
      - run: npm run test:db
